<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="stylesheet" href="/shared/ocean-loader.css">
    <script src="/shared/ocean-loader.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelime Avı - TDK Oyunu</title>
    <style>
        :root {
            --bg: #0a1628;
            --card-bg: #112240;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --text: #e2e8f0;
            --text-light: #94a3b8;
            --border: #1e3a5f;
            --success: #10b981;
            --error: #f87171;
            --warning: #fbbf24;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #0f1f3a 50%, #162a4a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            color: var(--text);
        }

        .game-wrapper {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow);
            font-size: 0.9em;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }
        .top-bar .user {
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-bar .user svg {
            width: 20px;
            height: 20px;
            color: var(--primary);
        }
        .top-bar .total-score {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 4px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .top-bar .timer-box {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            white-space: nowrap;
        }
        .timer-box.warning {
            background: rgba(251, 191, 36, 0.15);
            color: #fcd34d;
            border-color: rgba(251, 191, 36, 0.4);
            animation: pulse 0.8s infinite;
        }
        .timer-box.danger {
            background: rgba(248, 113, 113, 0.15);
            color: #fca5a5;
            border-color: rgba(248, 113, 113, 0.4);
            animation: pulse 0.5s infinite;
        }

        .main-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 24px 22px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border: 1px solid var(--border);
        }

        .game-title {
            text-align: center;
            font-size: 1.3em;
            font-weight: 700;
            color: #f1f5f9;
            letter-spacing: -0.3px;
        }
        .game-title span {
            color: var(--primary);
        }

        .definition-card {
            background: #0d1b33;
            border: 1.5px solid #1e3a5f;
            border-radius: var(--radius-sm);
            padding: 18px 16px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.95em;
            color: #cbd5e1;
            position: relative;
            transition: var(--transition);
            word-break: break-word;
        }
        .definition-card.loading {
            color: #64748b;
            font-style: italic;
        }
        .definition-card .quote-mark {
            position: absolute;
            top: 8px;
            left: 12px;
            font-size: 2.2em;
            color: #1e3a5f;
            line-height: 1;
            pointer-events: none;
        }

        .hint-row {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .hint-badge {
            background: rgba(251, 191, 36, 0.15);
            color: #fcd34d;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 0.78em;
            font-weight: 500;
            border: 1px solid rgba(251, 191, 36, 0.4);
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .hint-badge.show {
            display: inline-block;
        }
        .hint-btn {
            background: none;
            border: 1.5px dashed #2d4a6b;
            color: #94a3b8;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 0.78em;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
        }
        .hint-btn:hover {
            border-color: var(--primary);
            color: #bfdbfe;
            background: rgba(59, 130, 246, 0.1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .input-group {
            display: flex;
            gap: 10px;
        }
        #wordInput {
            flex: 1;
            padding: 13px 16px;
            font-size: 1em;
            border: 2px solid #1e3a5f;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: var(--transition);
            background: #0d1b33;
            color: #e2e8f0;
        }
        #wordInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
            background: #0f1f3a;
        }
        #wordInput::placeholder {
            color: #475569;
            font-weight: 400;
            letter-spacing: 0;
        }

        .btn-primary {
            padding: 13px 20px;
            font-size: 0.9em;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            background: var(--primary);
            color: #fff;
            transition: var(--transition);
            white-space: nowrap;
            letter-spacing: 0.2px;
        }
        .btn-primary:hover {
            background: #2563eb;
            box-shadow: 0 2px 12px rgba(59, 130, 246, 0.4);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-outline {
            flex: 1;
            min-width: 80px;
            padding: 10px 14px;
            font-size: 0.82em;
            font-weight: 600;
            border: 2px solid #1e3a5f;
            border-radius: var(--radius-sm);
            cursor: pointer;
            background: #0f1f3a;
            color: #cbd5e1;
            transition: var(--transition);
            text-align: center;
            letter-spacing: 0.2px;
        }
        .btn-outline:hover {
            border-color: #3b82f6;
            background: #132644;
            color: #f1f5f9;
        }
        .btn-outline.skip {
            border-color: rgba(251, 191, 36, 0.4);
            color: #fcd34d;
            background: rgba(251, 191, 36, 0.1);
        }
        .btn-outline.skip:hover {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.2);
        }
        .btn-outline.save {
            border-color: rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
            background: rgba(16, 185, 129, 0.1);
        }
        .btn-outline.save:hover {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.2);
        }
        .btn-outline.home {
            border-color: rgba(139, 92, 246, 0.4);
            color: #c4b5fd;
            background: rgba(139, 92, 246, 0.1);
        }
        .btn-outline.home:hover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.2);
        }

        .feedback {
            text-align: center;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.88em;
            display: none;
            animation: fadeIn 0.3s ease;
            letter-spacing: 0.2px;
        }
        .feedback.correct {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border: 1.5px solid rgba(16, 185, 129, 0.4);
            display: block;
        }
        .feedback.wrong {
            background: rgba(248, 113, 113, 0.15);
            color: #fca5a5;
            border: 1.5px solid rgba(248, 113, 113, 0.4);
            display: block;
        }
        .feedback.info {
            background: rgba(251, 191, 36, 0.15);
            color: #fcd34d;
            border: 1.5px solid rgba(251, 191, 36, 0.4);
            display: block;
        }

        .score-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .score-chip {
            flex: 1;
            min-width: 60px;
            background: #0d1b33;
            border: 1.5px solid #1e3a5f;
            border-radius: var(--radius-sm);
            padding: 10px 8px;
            text-align: center;
            transition: var(--transition);
        }
        .score-chip .chip-value {
            font-size: 1.3em;
            font-weight: 700;
            color: #f1f5f9;
        }
        .score-chip .chip-label {
            font-size: 0.7em;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
        .score-chip.highlight {
            animation: chipPulse 0.5s ease;
            border-color: #3b82f6;
            background: #132644;
        }
        @keyframes chipPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        @media (max-width: 480px) {
            .game-wrapper {
                gap: 10px;
            }
            .main-card {
                padding: 16px 12px 14px;
                gap: 12px;
            }
            .definition-card {
                padding: 14px 10px;
                font-size: 0.88em;
                min-height: 70px;
            }
            #wordInput {
                padding: 11px 12px;
                font-size: 0.9em;
            }
            .btn-primary {
                padding: 11px 14px;
                font-size: 0.82em;
            }
            .btn-outline {
                padding: 8px 10px;
                font-size: 0.76em;
            }
            .score-chip .chip-value {
                font-size: 1.1em;
            }
            .top-bar {
                font-size: 0.8em;
                padding: 10px 12px;
            }
        }
    </style>
</head>

    <div class="game-wrapper">
        <div class="top-bar">
            <div class="user">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
                <span id="userName">Kullanıcı</span>
            </div>
            <div class="timer-box" id="timerBox">
                ⏱️ <span id="timerDisplay">02:00</span>
            </div>
            <div class="total-score">
                💎 <span id="userTotalScore">0</span> TP
            </div>
        </div>

        <div class="main-card">
            <div class="game-title">📖 <span>Kelime Avı</span></div>

            <div class="definition-card loading" id="definitionBox">
                <span class="quote-mark">"</span>
                Kelime yükleniyor...
            </div>

            <div class="hint-row">
                <button class="hint-btn" id="hintBtn" onclick="showHint()">💡 İpucu Göster</button>
                <span class="hint-badge" id="hintBadge"></span>
            </div>

            <div class="input-group">
                <input type="text" id="wordInput" placeholder="Kelimeyi yazın..." autocomplete="off" maxlength="40">
                <button class="btn-primary" onclick="checkAnswer()">Kontrol Et</button>
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="score-row">
                <div class="score-chip" id="chipCorrect">
                    <div class="chip-value" id="correct">0</div>
                    <div class="chip-label">Doğru</div>
                </div>
                <div class="score-chip" id="chipWrong">
                    <div class="chip-value" id="wrong">0</div>
                    <div class="chip-label">Yanlış</div>
                </div>
                <div class="score-chip" id="chipTotal">
                    <div class="chip-value" id="totalScore">0</div>
                    <div class="chip-label">Bu Oyun</div>
                </div>
                <div class="score-chip" id="chipQuestion">
                    <div class="chip-value" id="questionCount">0</div>
                    <div class="chip-label">Soru</div>
                </div>
            </div>

            <div class="btn-row">
                <button class="btn-outline skip" onclick="skipWord()">⏭ Pas Geç</button>
                <button class="btn-outline" onclick="newGame()">🔄 Yeni Oyun</button>
                <button class="btn-outline save" onclick="saveScore()">💾 Kaydet</button>
                <button class="btn-outline home" onclick="goHome()">🏠 Çıkış</button>
            </div>
        </div>
    </div>

            'derin', 'sığ', 'kalın', 'ince', 'ağır', 'hafif', 'sert', 'yumuşak', 'sıcak', 'soğuk',
            'ılık', 'serin', 'hızlı', 'yavaş', 'erken', 'geç', 'yeni', 'eski', 'taze', 'bayat',
            'temiz', 'kirli', 'düzenli', 'dağınık', 'sakin', 'hareketli', 'sessiz', 'gürültülü',
            'aydınlık', 'karanlık', 'parlak', 'mat', 'renkli', 'soluk', 'canlı', 'donuk',
            'mutlu', 'üzgün', 'neşeli', 'keyifsiz', 'umutlu', 'umutsuz', 'karamsar', 'iyimser',
            'cömert', 'cimri', 'çalışkan', 'tembel', 'dürüst', 'yalancı', 'sadık', 'vefalı',
            'nazik', 'kaba', 'zarif', 'kaba', 'hoşgörülü', 'tahammülsüz', 'sabırlı', 'sabırsız',
            'mütevazı', 'kibirli', 'alçakgönüllü', 'mağrur', 'gururlu', 'onurlu',
        ];

        const UNIQUE_WORDS = [...new Set(WORD_POOL.map(w => w.toLowerCase().replace(/\s+/g, ' ').trim()))];

        let currentWord = '';
        let currentHint = '';
        let score = {
            correct: 0,
            wrong: 0,
            total: 0,
            questions: 0
        };
        let isProcessing = false;
        let timerSeconds = 120;
        let timerInterval = null;
        let scoreSaved = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const timerBox = document.getElementById('timerBox');

        function formatTime(seconds) {
            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = formatTime(timerSeconds);
            timerBox.classList.remove('warning', 'danger');
            if (timerSeconds <= 30 && timerSeconds > 10) {
                timerBox.classList.add('warning');
            } else if (timerSeconds <= 10) {
                timerBox.classList.add('danger');
            }
        }

        function startTimer() {
            stopTimer();
            timerSeconds = 120;
            scoreSaved = false;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timerSeconds -= 1;
                updateTimerDisplay();
                if (timerSeconds <= 0) {
                    stopTimer();
                    timerDisplay.textContent = '00:00';
                    saveScoreAndReturnHome();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function getRandomWord() {
            return UNIQUE_WORDS[Math.floor(Math.random() * UNIQUE_WORDS.length)];
        }

        function generateHint(word) {
            const cleanWord = word.replace(/\s+/g, '');
            const firstLetter = word[0].toUpperCase();
            const length = cleanWord.length;
            const vowels = (cleanWord.match(/[aeıioöuü]/gi) || []).length;
            return `${firstLetter}... | ${length} harf | ${vowels} ünlü`;
        }

        async function fetchWord() {
            if (isProcessing) return;
            isProcessing = true;

            const defBox = document.getElementById('definitionBox');
            const hintBadge = document.getElementById('hintBadge');
            const feedback = document.getElementById('feedback');
            const wordInput = document.getElementById('wordInput');

            defBox.textContent = '';
            defBox.classList.add('loading');
            defBox.innerHTML = '<span class="quote-mark">"</span>Kelime yükleniyor...';
            hintBadge.classList.remove('show');
            hintBadge.textContent = '';
            feedback.style.display = 'none';
            feedback.className = 'feedback';
            wordInput.value = '';
            currentHint = '';
            currentWord = '';

            let attempts = 0;
            const maxAttempts = 5;
            let success = false;

            while (attempts < maxAttempts && !success) {
                const candidate = getRandomWord();
                try {
                    const response = await fetch(`https://sozluk.gov.tr/gts?ara=${encodeURIComponent(candidate)}`);
                    const data = await response.json();

                    if (data && Array.isArray(data) && data[0] && data[0].anlamlarListe && data[0].anlamlarListe[0]) {
                        currentWord = data[0].madde.toLowerCase();
                        const definition = data[0].anlamlarListe[0].anlam;

                        if (definition.length < 10 || definition.length > 400) {
                            attempts++;
                            continue;
                        }

                        defBox.classList.remove('loading');
                        defBox.innerHTML = '<span class="quote-mark">"</span>' + definition;
                        currentHint = generateHint(currentWord);
                        hintBadge.textContent = '💡 ' + currentHint;
                        success = true;
                    } else {
                        attempts++;
                    }
                } catch (error) {
                    attempts++;
                }
            }

            if (!success) {
                const fallback = UNIQUE_WORDS[Math.floor(Math.random() * 100)];
                currentWord = fallback;
                defBox.classList.remove('loading');
                defBox.innerHTML = '<span class="quote-mark">"</span>Bu kelimenin TDK tanımı geçici olarak alınamadı. Lütfen tahmin etmeyi deneyin.';
                currentHint = generateHint(currentWord);
                hintBadge.textContent = '💡 ' + currentHint;
            }

            wordInput.focus();
            isProcessing = false;
        }

        function showHint() {
            const hintBadge = document.getElementById('hintBadge');
            if (currentHint && !hintBadge.classList.contains('show')) {
                hintBadge.classList.add('show');
                clearTimeout(hintBadge._timeout);
                hintBadge._timeout = setTimeout(() => {
                    hintBadge.classList.remove('show');
                }, 4000);
            } else if (hintBadge.classList.contains('show')) {
                hintBadge.classList.remove('show');
                clearTimeout(hintBadge._timeout);
            }
        }

        function checkAnswer() {
            if (isProcessing || timerSeconds <= 0) return;

            const userAnswer = document.getElementById('wordInput').value.toLowerCase().trim();
            const feedback = document.getElementById('feedback');

            if (!userAnswer) {
                feedback.textContent = '⚠️ Lütfen bir kelime girin.';
                feedback.className = 'feedback info';
                feedback.style.display = 'block';
                setTimeout(() => { feedback.style.display = 'none'; }, 1800);
                return;
            }

            if (!currentWord) {
                feedback.textContent = '⏳ Kelime henüz yüklenmedi, lütfen bekleyin.';
                feedback.className = 'feedback info';
                feedback.style.display = 'block';
                setTimeout(() => { feedback.style.display = 'none'; }, 1800);
                return;
            }

            isProcessing = true;
            score.questions++;

            const normalizedUser = userAnswer.replace(/\s+/g, '').trim();
            const normalizedCorrect = currentWord.replace(/\s+/g, '').trim();

            if (normalizedUser === normalizedCorrect) {
                score.correct++;
                const points = 10;
                score.total += points;
                feedback.textContent = `✅ Doğru! "${currentWord}" +${points} puan`;
                feedback.className = 'feedback correct';
                document.getElementById('chipCorrect').classList.add('highlight');
                document.getElementById('chipTotal').classList.add('highlight');
                setTimeout(() => {
                    document.getElementById('chipCorrect').classList.remove('highlight');
                    document.getElementById('chipTotal').classList.remove('highlight');
                }, 500);
            } else {
                score.wrong++;
                score.total = Math.max(0, score.total - 3);
                feedback.textContent = `❌ Yanlış! Cevap: "${currentWord}" -3 puan`;
                feedback.className = 'feedback wrong';
                document.getElementById('chipWrong').classList.add('highlight');
                setTimeout(() => {
                    document.getElementById('chipWrong').classList.remove('highlight');
                }, 500);
            }

            feedback.style.display = 'block';
            updateScoreDisplay();

            setTimeout(() => {
                feedback.style.display = 'none';
                isProcessing = false;
                fetchWord();
            }, 2000);
        }

        function skipWord() {
            if (isProcessing || timerSeconds <= 0) return;
            if (!currentWord) return;

            isProcessing = true;
            score.questions++;
            const feedback = document.getElementById('feedback');
            feedback.textContent = `⏭ Pas geçildi. Kelime: "${currentWord}"`;
            feedback.className = 'feedback info';
            feedback.style.display = 'block';
            updateScoreDisplay();

            setTimeout(() => {
                feedback.style.display = 'none';
                isProcessing = false;
                fetchWord();
            }, 1800);
        }

        function updateScoreDisplay() {
            document.getElementById('correct').textContent = score.correct;
            document.getElementById('wrong').textContent = score.wrong;
            document.getElementById('totalScore').textContent = score.total;
            document.getElementById('questionCount').textContent = score.questions;
        }

        function newGame() {
            if (score.total > 0 && !confirm('Kaydedilmemiş puanlarınız silinecek. Emin misiniz?')) {
                return;
            }
            score = { correct: 0, wrong: 0, total: 0, questions: 0 };
            updateScoreDisplay();
            document.getElementById('feedback').style.display = 'none';
            document.getElementById('hintBadge').classList.remove('show');
            document.getElementById('chipCorrect').classList.remove('highlight');
            document.getElementById('chipWrong').classList.remove('highlight');
            document.getElementById('chipTotal').classList.remove('highlight');
            stopTimer();
            startTimer();
            fetchWord();
        }

        async function saveScore() {
            if (score.total <= 0) {
                alert('Kaydedilecek puan yok. Önce biraz oynayın!');
                return;
            }

            try {
                const response = await fetch('/save-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        score: score.total,
                        scoreMode: 'add',
                        scoreScope: 'main',
                        finalizeLevelScore: true
                    })
                });
                const data = await response.json();

                if (data.success) {
                    alert(`✅ ${score.total} puan hesabınıza eklendi!\nToplam puanınız: ${data.toplamPuan}`);
                    document.getElementById('userTotalScore').textContent = data.toplamPuan;
                    score = { correct: 0, wrong: 0, total: 0, questions: 0 };
                    updateScoreDisplay();
                    document.getElementById('feedback').style.display = 'none';
                    document.getElementById('hintBadge').classList.remove('show');
                    stopTimer();
                    startTimer();
                    fetchWord();
                } else {
                    alert('❌ Puan kaydedilemedi. Lütfen tekrar deneyin.');
                }
            } catch (error) {
                console.error('Kaydetme hatası:', error);
                alert('❌ Bağlantı hatası. Lütfen tekrar deneyin.');
            }
        }

        async function saveScoreAndReturnHome() {
            if (scoreSaved) return;
            scoreSaved = true;
            stopTimer();

            try {
                const response = await fetch('/save-score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        score: score.total,
                        scoreMode: 'add',
                        scoreScope: 'main',
                        finalizeLevelScore: true,
                        correct: score.correct,
                        wrong: score.wrong
                    })
                });
                const data = await response.json();

                if (data.success) {
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => {
                        window.location.href = '/pc/anasayfa.html';
                    }, 600);
                } else {
                    alert('❌ Puan kaydedilemedi, yine de anasayfaya dönülüyor.');
                    window.location.href = '/pc/anasayfa.html';
                }
            } catch (error) {
                console.error('Kaydetme hatası:', error);
                window.location.href = '/pc/anasayfa.html';
            }
        }

        async function loadUserInfo() {
            try {
                const response = await fetch('/me');
                const data = await response.json();
                if (!data.loggedIn) {
                    window.location.href = '/';
                    return;
                }
                document.getElementById('userName').textContent = data.isim || 'Kullanıcı';
                document.getElementById('userTotalScore').textContent = data.puan || 0;
            } catch (error) {
                console.error('Kullanıcı bilgisi alınamadı:', error);
                document.getElementById('userName').textContent = 'Kullanıcı';
                document.getElementById('userTotalScore').textContent = '0';
            }
        }

        function goHome() {
            if (score.total > 0) {
                if (confirm('Kaydedilmemiş puanlarınız var. Kaydedip çıkmak ister misiniz?')) {
                    saveScore().then(() => {
                        stopTimer();
                        setTimeout(() => { window.location.href = '/pc/anasayfa.html'; }, 800);
                    });
                    return;
                }
            }
            stopTimer();
            window.location.href = '/pc/anasayfa.html';
        }

        document.getElementById('wordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                checkAnswer();
            }
        });

        loadUserInfo();
        startTimer();
        fetchWord();
    </script>
</body>
</html>
