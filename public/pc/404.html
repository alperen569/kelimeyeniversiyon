<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sayfa Bulunamadı | Kelime Okyanusu</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'Inter', sans-serif;
      background: linear-gradient(180deg, #020617 0%, #0f172a 40%, #1e3a8a 100%);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Okyanus dalga katmanları */
    .ocean-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .wave {
      position: absolute;
      left: -10%;
      right: -10%;
      border-radius: 45%;
      animation: waveDrift 14s linear infinite;
      opacity: 0.3;
    }

    .wave:nth-child(1) {
      bottom: 15%;
      height: 250px;
      background: rgba(14, 165, 233, 0.15);
      animation-duration: 12s;
    }

    .wave:nth-child(2) {
      bottom: 5%;
      height: 220px;
      background: rgba(56, 189, 248, 0.12);
      animation-duration: 16s;
      animation-direction: reverse;
    }

    .wave:nth-child(3) {
      bottom: -5%;
      height: 200px;
      background: rgba(125, 211, 252, 0.08);
      animation-duration: 20s;
    }

    @keyframes waveDrift {
      from { transform: translateX(0) rotate(0deg); }
      to { transform: translateX(5%) rotate(3deg); }
    }

    /* Baloncuklar */
    .bubbles-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .bubble-404 {
      position: absolute;
      bottom: -60px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.55), rgba(56,189,248,0.08) 60%);
      border: 1px solid rgba(255,255,255,0.15);
      animation: bubbleRise linear infinite;
      opacity: 0.55;
    }

    @keyframes bubbleRise {
      0% { transform: translateY(0) scale(0.75); opacity: 0; }
      15% { opacity: 0.65; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
    }

    /* Kart */
    .error-card {
      position: relative;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 32px;
      padding: 48px 36px;
      max-width: 540px;
      width: 92%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(2, 6, 23, 0.55), 0 0 0 1px rgba(56, 189, 248, 0.1);
      animation: floatCard 4s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .error-number {
      font-size: clamp(96px, 15vw, 140px);
      font-weight: 900;
      background: linear-gradient(135deg, #38bdf8, #22c55e, #facc15);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      letter-spacing: -4px;
      margin-bottom: 8px;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #0891b2);
      color: white;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
    }

    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(37, 99, 235, 0.45);
    }
  </style>
</head>
<body>

  <!-- Okyanus dalgaları -->
  <div class="ocean-bg">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <!-- Baloncuklar -->
  <div class="bubbles-layer" id="bubblesLayer"></div>

  <!-- Hata kartı -->
  <div class="error-card">
    <div class="text-5xl mb-3">🌊</div>
    <div class="error-number">404</div>
    <h2 class="text-white text-xl font-bold mb-3">Kayıp Hazine!</h2>
    <p class="text-slate-300 text-sm leading-relaxed mb-6">
      Aradığın sayfa okyanusun derinliklerinde kayboldu.<br />
      Rotanı yeniden belirlemeye ne dersin, Kaptan?
    </p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <a href="anasayfa.html" class="btn-home">
        🏠 Ana Sayfaya Dön
      </a>
      <a href="Kelime-Okyanusu-Seviye-Seçimi.html" 
         class="btn-home" 
         style="background: linear-gradient(135deg, #059669, #0d9488);">
        🎮 Oyuna Başla
      </a>
    </div>
    <p class="text-slate-500 text-xs mt-6">
      © 2025 Kelime Okyanusu · 
      <a href="mailto:info@kelimeokyanusu.com.tr" class="text-blue-400 hover:underline">info@kelimeokyanusu.com.tr</a>
    </p>
  </div>

  <script>
    // Baloncuk oluşturma
    (function() {
      const layer = document.getElementById('bubblesLayer');
      if (!layer) return;

      for (let i = 0; i < 20; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble-404';

        const size = 18 + Math.random() * 55;
        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';
        bubble.style.left = Math.random() * 100 + '%';
        bubble.style.animationDuration = (10 + Math.random() * 14) + 's';
        bubble.style.animationDelay = Math.random() * 8 + 's';

        layer.appendChild(bubble);
      }
    })();
  </script>
</body>
</html>
