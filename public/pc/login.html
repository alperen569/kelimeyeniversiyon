<!doctype html>
<html lang="tr">
  <head>
    <link rel="stylesheet" href="/shared/ocean-loader.css" />
    <script src="/shared/ocean-loader.js"></script>

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Kelime Okyanusu | Giriş</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #020617;
        --panel: #0b1638;
        --line: #1e2f5a;
        --text: #e8edff;
        --muted: #8b9bc7;
        --accent: #1a3d7c;
        --accent-hover: #2653a6;
        --radius: 20px;
        --font: "Roboto", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font);
        color: var(--text);
        background-image: url("resimler/background.png");
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .page {
        width: 100%;
        max-width: 500px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 28px 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .mini-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .mini-brand img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        object-fit: cover;
        border: 1px solid #e5e7eb;
      }

      .mini-brand strong {
        display: block;
        font-size: 1.05rem;
        font-weight: 900;
      }

      .mini-brand span {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        background: #0a1129;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 5px;
      }

      .tabs button {
        border: none;
        border-radius: 10px;
        padding: 12px 10px;
        background: transparent;
        color: var(--muted);
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
      }

      .tabs button.active {
        background: var(--accent);
        color: #fff;
      }

      .stage {
        position: relative;
        min-height: 460px; /* Kayıt formunun tamamını sığdıracak şekilde artırıldı */
      }

      .form {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition: 0.3s;
      }

      .form.active {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .eyebrow {
        color: #7b93d0;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .form h2 {
        margin: 8px 0 4px;
        font-size: 1.9rem;
        font-weight: 900;
      }

      .subtitle {
        color: var(--muted);
        margin-bottom: 20px;
        font-size: 0.95rem;
      }

      .field {
        margin-bottom: 14px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        font-weight: 700;
        font-size: 0.9rem;
      }

      .input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 15px;
        background: #0e1835;
        color: var(--text);
        outline: none;
        transition: border-color 0.2s;
      }

      .input::placeholder {
        color: #5c6d9c;
      }

      .input:focus {
        border-color: #3b6bc7;
      }

      .primary {
        width: 100%;
        margin-top: 6px;
        border: none;
        border-radius: 12px;
        padding: 14px 16px;
        background: var(--accent);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
        transition: background 0.2s;
      }

      .primary:hover {
        background: var(--accent-hover);
      }

      .switch {
        margin-top: 20px;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        cursor: pointer;
      }

      .switch strong {
        color: #5d83d4;
      }

      .switch:hover {
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      button,
      input {
        font: inherit;
      }

      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #3b6bc7;
        outline-offset: 2px;
      }

      @media (max-width: 500px) {
        .card {
          padding: 20px 16px;
        }
        .form h2 {
          font-size: 1.6rem;
        }
        .stage {
          min-height: 480px; /* Mobilde biraz daha yükseklik */
        }
      }
      .toast {
  position: fixed;
  top: 25px;
  left: 50%;
  transform: translateX(-50%) translateY(-30px);
  background: #0b1638;
  color: #fff;
  padding: 15px 22px;
  border-radius: 12px;
  border: 1px solid #2d4f94;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  opacity: 0;
  pointer-events: none;
  transition: .35s;
  z-index: 9999;
  max-width: 420px;
  text-align: center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.toast.success{
  border-color:#34d399;
}

.toast.error{
  border-color:#ef4444;
}

.toast.info{
  border-color:#60a5fa;
}
    </style>
  </head>
  <div id="toast" class="toast"></div>
  <body>
    <main class="page">
      <section class="card">
        <div class="mini-brand">
          <img
            src="resimler/kelimeokyanusu-logo.png"
            alt="Kelime Okyanusu logosu"
          />
          <div>
            <strong>Kelime Okyanusu</strong>
            <span>Giriş yap veya yeni hesap oluştur</span>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="Giriş ve kayıt sekmeleri">
          <button
            id="loginTab"
            class="active"
            type="button"
            onclick="showLogin()"
          >
            Giriş Yap
          </button>
          <button id="registerTab" type="button" onclick="showRegister()">
            Kayıt Ol
          </button>
        </div>

        <div class="stage">
          <form
            id="loginBox"
            class="form active"
            onsubmit="login(); return false;"
          >
            <span class="eyebrow">Hoş geldin</span>
            <h2>Giriş Yap</h2>
            <p class="subtitle">
              Kullanıcı adını ve şifreni girerek devam et.
            </p>

            <div class="field">
              <label for="loginName">Kullanıcı adı veya E-posta</label>
              <input
                class="input"
                type="text"
                id="loginName"
                placeholder="Kullanıcı adı veya e-posta"
              />
            </div>

            <div class="field">
              <label for="loginPass">Şifre</label>
              <input
                class="input"
                type="password"
                id="loginPass"
                placeholder="Şifreni yaz"
              />
            </div>

            <button class="primary" type="submit">Giriş Yap</button>

            <p class="switch" onclick="showRegister()">
              Hesabın yok mu? <strong>Kayıt ol</strong>
            </p>
          </form>

          <form
            id="registerBox"
            class="form"
            onsubmit="register(); return false;"
          >
            <span class="eyebrow">Yeni hesap</span>
            <h2>Kayıt Ol</h2>
            <p class="subtitle">
              Yeni bir kullanıcı adı ve şifre ile hesap oluştur.
            </p>

            <div class="field">
              <label for="regName">Kullanıcı adı</label>
              <input
                class="input"
                type="text"
                id="regName"
                placeholder="Yeni kullanıcı adını yaz"
              />
            </div>
            <div class="field">
              <label for="registerEmail">E-posta</label>
              <input
                class="input"
                type="email"
                id="registerEmail"
                placeholder="ornek@mail.com"
              />
            </div>
            <div class="field">
              <label for="regPass">Şifre</label>
              <input
                class="input"
                type="password"
                id="regPass"
                placeholder="Yeni şifreni yaz"
              />
            </div>

            <button class="primary" type="submit">Kayıt Ol</button>

            <p class="switch" onclick="showLogin()">
              Zaten hesabın var mı? <strong>Giriş yap</strong>
            </p>
          </form>
        </div>
      </section>
    </main>

    <script>
      const loginBox = document.getElementById("loginBox");
      const registerBox = document.getElementById("registerBox");
      const loginTab = document.getElementById("loginTab");
      const registerTab = document.getElementById("registerTab");

      function showLogin() {
        loginBox.classList.add("active");
        registerBox.classList.remove("active");
        loginTab.classList.add("active");
        registerTab.classList.remove("active");
      }

      function showRegister() {
        registerBox.classList.add("active");
        loginBox.classList.remove("active");
        registerTab.classList.add("active");
        loginTab.classList.remove("active");
      }

      function showToast(message, type = "info") {
  const toast = document.getElementById("toast");

  toast.textContent = message;
  toast.className = `toast show ${type}`;

  clearTimeout(toast.timer);

  toast.timer = setTimeout(() => {
    toast.classList.remove("show");
  }, 4500);
}

      async function login() {
        const isim = document.getElementById("loginName").value.trim();
        const sifre = document.getElementById("loginPass").value;

        if (!isim || !sifre) {
          alert("Lütfen boş alan bırakma.");
          return;
        }

        try {
          const res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ isim, sifre }),
          });
          const data = await res.json();

          if (!data.success) {
            alert(data.message || "Giriş başarısız.");
            return;
          }

          sessionStorage.setItem("kw_logged_in", "true");
          sessionStorage.setItem("kw_username", isim);
          if (window.kwNavigate) {
            window.kwNavigate("/pc/anasayfa.html");
          } else {
            window.location.href = "/pc/anasayfa.html";
          }
        } catch (err) {
         showToast("Sunucuya bağlanılamadı.", "error");
        }
      }

      async function register() {
        const isim = document.getElementById("regName").value.trim();
        const email = document.getElementById("registerEmail").value.trim();
        const sifre = document.getElementById("regPass").value;

        if (!isim || !email || !sifre) {
          alert("Lütfen bütün alanları doldurun.");
          return;
        }

        try {
          const res = await fetch("/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
              isim,
              email,
              sifre
            })
          });
          const data = await res.json();

      if (data.success) {

    showToast(
        "✅ Hesabın oluşturuldu.\n\nE-posta adresine bir doğrulama bağlantısı gönderdik. Hesabını kullanabilmek için lütfen e-postanı kontrol edip doğrulama işlemini tamamla.",
        "success"
    );

    document.getElementById("loginName").value = isim;
    document.getElementById("loginPass").value = "";
    showLogin();
    document.getElementById("loginPass").focus();

} else {

    showToast(data.message || "Kayıt oluşturulamadı.", "error");

}
          if (data.success) {
            document.getElementById("loginName").value = isim;
            document.getElementById("loginPass").value = "";
            showLogin();
            document.getElementById("loginPass").focus();
          }
        } catch (err) {
         showToast("Sunucuya bağlanılamadı.", "error");
        }
      }
    </script>
  </body>
</html>
