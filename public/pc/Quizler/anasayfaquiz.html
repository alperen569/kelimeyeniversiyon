<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Oyunları - Ana Sayfa</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      padding: 20px;
    }

    /* Sade arka plan dokusu */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 30% 40%, rgba(56, 189, 248, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, rgba(99, 102, 241, 0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 16px;
      padding: 35px 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: #38bdf8;
      margin: 0 auto 28px;
      border-radius: 2px;
      opacity: 0.7;
    }

    .game-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    a {
      text-decoration: none;
      display: block;
    }

    .game-btn {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      color: #cbd5e1;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      text-align: left;
    }

    .game-btn:hover {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.3);
      color: #f1f5f9;
    }

    .game-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .icon-din { background: rgba(251, 191, 36, 0.15); }
    .icon-turkce { background: rgba(244, 114, 182, 0.15); }
    .icon-tarih { background: rgba(96, 165, 250, 0.15); }
    .icon-fen { background: rgba(52, 211, 153, 0.15); }

    .btn-text {
      flex: 1;
    }

    .btn-arrow {
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.85rem;
      transition: color 0.2s, transform 0.2s;
    }

    .game-btn:hover .btn-arrow {
      color: #38bdf8;
      transform: translateX(2px);
    }

    .footer-text {
      margin-top: 24px;
      color: #64748b;
      font-size: 0.78rem;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Quiz Oyunları</h1>
    <div class="divider"></div>

    <div class="game-list">
      <!-- Din Dersi -->
      <a href="dinquiz.html">
        <button class="game-btn">
          <span class="game-icon icon-din">📖</span>
          <span class="btn-text">Din Dersi Quiz</span>
          <span class="btn-arrow">→</span>
        </button>
      </a>

      <!-- Türkçe -->
      <a href="türkçequiz.html">
        <button class="game-btn">
          <span class="game-icon icon-turkce">📝</span>
          <span class="btn-text">Türkçe Quiz</span>
          <span class="btn-arrow">→</span>
        </button>
      </a>

      <!-- Tarih -->
      <a href="tarihquiz.html">
        <button class="game-btn">
          <span class="game-icon icon-tarih">🏛️</span>
          <span class="btn-text">Tarih Quiz</span>
          <span class="btn-arrow">→</span>
        </button>
      </a>

      <!-- Fen Bilimleri -->
      <a href="fenquiz.html">
        <button class="game-btn">
          <span class="game-icon icon-fen">🔬</span>
          <span class="btn-text">Fen Bilimleri Quiz</span>
          <span class="btn-arrow">→</span>
        </button>
      </a>
    </div>

    <div class="footer-text">Kategori seç ve başla</div>
  </div>

</body>
</html>
