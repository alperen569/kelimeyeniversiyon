<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kelime Okyanusu — Fen Bilimleri Quiz</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #120c1f;
      padding: 20px;
      color: #e0d6f0;
    }

    .wrap {
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: #1e1630;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 24px;
    }

    .hud {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: cover;
    }

    .logo h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #e8dff5;
    }

    .logo .small {
      font-size: 0.8rem;
      color: #9a8ab8;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .stat {
      flex: 1 1 40%;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .stat .num {
      font-weight: 700;
      font-size: 1.3rem;
      color: #a78bfa;
    }

    .stat .small {
      font-size: 0.7rem;
      color: #9a8ab8;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(167, 139, 250, 0.1);
      color: #a78bfa;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid rgba(167, 139, 250, 0.2);
    }

    .small {
      font-size: 0.8rem;
      color: #9a8ab8;
    }

    .btn {
      background: #7c3aed;
      color: #f5f0ff;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #6d28d9;
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cdbde8;
    }

    .btn.ghost:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .main {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timer {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #120c1f;
      border: 2px solid #3a2a5a;
      font-weight: 700;
      font-size: 1.1rem;
      color: #a78bfa;
    }

    .question-card {
      background: #120c1f;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid #3a2a5a;
    }

    .q-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #e8dff5;
    }

    .q-meta {
      font-size: 0.8rem;
      color: #7b6a95;
      margin-bottom: 16px;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .answer {
      background: #1e1630;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3a2a5a;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s, border-color 0.2s;
      font-size: 0.9rem;
      color: #cdbde8;
    }

    .answer:hover {
      background: #2a1f42;
      border-color: #5b3e8a;
    }

    .answer .letter {
      font-weight: 700;
      color: #a78bfa;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: rgba(167, 139, 250, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .answer.correct {
      background: #1a3a2a;
      border-color: #22c55e;
      color: #f0fdf4;
    }

    .answer.wrong {
      background: #7f1d1d;
      border-color: #ef4444;
      color: #fef2f2;
    }

    .answer.dim {
      opacity: 0.5;
      pointer-events: none;
    }

    .foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 0.8rem;
      color: #7b6a95;
    }

    .progress-wrap {
      width: 100%;
      height: 4px;
      background: #3a2a5a;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .progress-fill {
      height: 100%;
      background: #a78bfa;
      width: 0%;
      transition: width 0.3s;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .hint {
      font-size: 0.7rem;
      color: #7b6a95;
      margin-top: auto;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #2a1f42;
      color: #e8dff5;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 500;
      font-size: 0.9rem;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      transition: transform 0.35s ease, opacity 0.35s ease;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 700px) {
      .card {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .answers {
        grid-template-columns: 1fr;
      }
      .logo img {
        width: 48px;
        height: 48px;
      }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app">
    <div class="hud">
      <div class="logo">
        <img src="logo of okyanus.png" alt="Logo" />
        <div>
          <h1>Kelime Okyanusu</h1>
          <div class="small">Fen Bilimleri Quiz · 10 Soru</div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="small">PUAN</div><div class="num" id="score">0</div></div>
        <div class="stat"><div class="small">SIRA</div><div class="num" id="qIndex">0/10</div></div>
        <div class="stat"><div class="small">SERİ</div><div class="num" id="streak">0</div></div>
        <div class="stat"><div class="small">EN YÜKSEK</div><div class="num" id="high">0</div></div>
      </div>

      <div>
        <div class="small" style="margin-bottom:6px">Kategoriler</div>
        <div class="badges" id="categoryList"></div>
      </div>

      <div class="hint">Klavye (1-4) ile cevap ver. Hızlı cevap daha çok puan.</div>
    </div>

    <div class="main">
      <div class="topbar">
        <div>
          <div class="small" id="categoryTag">Kategori: Genel</div>
          <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="timer" id="timer"><span id="timeText">20</span></div>
      </div>

      <div class="question-card" id="qCard">
        <h2 class="q-title" id="questionText">Hazır — başlatmak için Başlat'a bas.</h2>
        <div class="q-meta" id="meta">10 soruluk seri başlayacak.</div>
        <div class="answers" id="answers"></div>
        <div class="foot">
          <span>Sıradaki: <span id="nextLabel">—</span></span>
        </div>
        <div class="controls">
          <button class="btn" id="startBtn">Başlat</button>
          <button class="btn ghost" id="musicBtn">🎵 Müzik</button>
          <button class="btn ghost" id="resetBtn">Sıfırla</button>
          <button class="btn ghost" id="shareBtn">Skoru Kopyala</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<audio id="bg-music" loop preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/10/25/audio_9f6b5d0b18.mp3" type="audio/mpeg">
</audio>

<script>
  const QUESTIONS = [
    { q: "Hangisi bir hücrenin temel yapı birimidir?", cat: "Biyoloji", opts: ["Doku", "Organ", "Hücre", "Sistem"], a: 2 },
    { q: "Su kaç derecede kaynar?", cat: "Fizik", opts: ["90°C", "100°C", "110°C", "80°C"], a: 1 },
    { q: "Hangi gezegen Güneş'e en yakındır?", cat: "Astronomi", opts: ["Venüs", "Mars", "Merkür", "Jüpiter"], a: 2 },
    { q: "Bir cismin kütlesi ile ağırlığı arasındaki fark nedir?", cat: "Fizik", opts: ["Hiçbir fark yoktur", "Kütle değişmez, ağırlık değişir", "İkisi de değişir", "Ağırlık her zaman sabittir"], a: 1 },
    { q: "Fotosentez hangi canlılarda görülür?", cat: "Biyoloji", opts: ["Hayvanlar", "Mantarlar", "Bitkiler", "Virüsler"], a: 2 },
    { q: "Hangi elementin simgesi O'dur?", cat: "Kimya", opts: ["Oksijen", "Osmium", "Oganesson", "Altın"], a: 0 },
    { q: "İnsan vücudundaki en büyük organ hangisidir?", cat: "Biyoloji", opts: ["Kalp", "Beyin", "Deri", "Akciğer"], a: 2 },
    { q: "Bir maddenin erime noktası ile donma noktası aynı mıdır?", cat: "Fizik", opts: ["Her zaman farklıdır", "Aynıdır", "Bazen aynıdır", "Bilmiyorum"], a: 1 },
    { q: "Dünya'nın uydusu nedir?", cat: "Astronomi", opts: ["Güneş", "Mars", "Ay", "Jüpiter"], a: 2 },
    { q: "Asitler ile bazların karışmasıyla ne oluşur?", cat: "Kimya", opts: ["Patlama", "Tuz ve su", "Sadece su", "Gaz"], a: 1 }
  ];

  QUESTIONS.forEach(q => {
    const correctText = q.opts[q.a];
    const shuffled = [...q.opts].sort(() => Math.random() - 0.5);
    q.opts = shuffled;
    q.a = shuffled.indexOf(correctText);
  });

  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const shareBtn = document.getElementById('shareBtn');
  const musicBtn = document.getElementById('musicBtn');
  const scoreEl = document.getElementById('score');
  const qIndexEl = document.getElementById('qIndex');
  const streakEl = document.getElementById('streak');
  const highEl = document.getElementById('high');
  const timeText = document.getElementById('timeText');
  const questionText = document.getElementById('questionText');
  const metaText = document.getElementById('meta');
  const answersWrap = document.getElementById('answers');
  const categoryTag = document.getElementById('categoryTag');
  const nextLabel = document.getElementById('nextLabel');
  const categoryList = document.getElementById('categoryList');
  const progressFill = document.getElementById('progressFill');
  const toast = document.getElementById('toast');

  let QUESTIONS_POOL = [];
  let currentIndex = 0;
  let score = 0;
  let streak = 0;
  let timer = null;
  let timeLeft = 20;
  let running = false;
  let highscore = Number(localStorage.getItem('kk_high')) || 0;
  let correctCount = 0;
  let wrongCount = 0;
  let scoreSaved = false;

  highEl.textContent = highscore;

  function populateCategories() {
    const cats = [...new Set(QUESTIONS.map(s => s.cat))];
    categoryList.innerHTML = '';
    cats.forEach(c => {
      const el = document.createElement('div');
      el.className = 'badge';
      el.textContent = c;
      categoryList.appendChild(el);
    });
  }
  populateCategories();

  function shuffle(arr) {
    return arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(a => a[1]);
  }

  function pickQuestions() {
    return shuffle(QUESTIONS).slice(0, 10);
  }

  function updateProgress() {
    const total = QUESTIONS_POOL.length || 10;
    const percent = (currentIndex / total) * 100;
    progressFill.style.width = `${percent}%`;
    qIndexEl.textContent = `${currentIndex}/${total}`;
  }

  function updateHUD() {
    scoreEl.textContent = score;
    streakEl.textContent = streak;
    nextLabel.textContent = QUESTIONS_POOL[currentIndex] ? QUESTIONS_POOL[currentIndex].cat : '—';
    updateProgress();
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toast.hideTimeout);
    toast.hideTimeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 3000);
  }

  async function saveScoreAndReturnHome() {
    if (scoreSaved) return;
    scoreSaved = true;
    showToast("Skor kaydediliyor, anasayfaya yönlendiriliyorsunuz...");

    try {
      const response = await fetch("/save-score", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          score: score,
          scoreMode: "add",
          scoreScope: "main",
          finalizeLevelScore: true,
          correct: correctCount,
          wrong: wrongCount,
          level: 4
        }),
      });

      const data = await response.json();

      if (data.success) {
        showToast("Skor kaydedildi, anasayfaya gidiliyor...");
        setTimeout(() => {
          window.location.href = "/pc/anasayfa.html";
        }, 1500);
      } else {
        showToast("Skor kaydedilemedi, tekrar deneniyor...");
        scoreSaved = false;
      }
    } catch (err) {
      console.log(err);
      showToast("Sunucu hatası, anasayfaya yönlendiriliyor...");
      setTimeout(() => {
        window.location.href = "/pc/anasayfa.html";
      }, 2000);
    }
  }

  function startGame() {
    QUESTIONS_POOL = pickQuestions();
    currentIndex = 0;
    score = 0;
    streak = 0;
    correctCount = 0;
    wrongCount = 0;
    running = true;
    scoreSaved = false;
    updateHUD();
    showQuestion();
    startBtn.textContent = 'Devam';
  }

  function endGame() {
    running = false;
    clearTimer();
    saveScoreAndReturnHome();
  }

  function showQuestion() {
    if (currentIndex >= QUESTIONS_POOL.length) {
      endGame();
      return;
    }
    const q = QUESTIONS_POOL[currentIndex];
    categoryTag.textContent = `Kategori: ${q.cat}`;
    questionText.textContent = q.q;
    metaText.textContent = `Soru ${currentIndex + 1}/${QUESTIONS_POOL.length}`;
    answersWrap.innerHTML = '';
    q.opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'answer';
      btn.innerHTML = `<span class="letter">${['A', 'B', 'C', 'D'][i]}</span>${opt}`;
      btn.addEventListener('click', () => selectAnswer(i));
      answersWrap.appendChild(btn);
    });
    timeLeft = 20;
    timeText.textContent = timeLeft;
    startTimer();
  }

  function selectAnswer(choice) {
    const q = QUESTIONS_POOL[currentIndex];
    clearTimer();
    const buttons = answersWrap.querySelectorAll('.answer');
    buttons.forEach(b => b.classList.add('dim'));

    if (choice === q.a) {
      buttons[choice].classList.add('correct');
      score += 100;
      streak++;
      correctCount++;
    } else {
      if (choice >= 0) buttons[choice].classList.add('wrong');
      buttons[q.a].classList.add('correct');
      streak = 0;
      wrongCount++;
    }
    currentIndex++;
    updateHUD();
    setTimeout(() => {
      if (running) showQuestion();
    }, 700);
  }

  function startTimer() {
    clearTimer();
    timer = setInterval(() => {
      timeLeft--;
      timeText.textContent = timeLeft;
      if (timeLeft <= 0) {
        selectAnswer(-1);
      }
    }, 1000);
  }

  function clearTimer() {
    if (timer) {
      clearInterval(timer);
      timer = null;
    }
  }

  startBtn.addEventListener('click', () => {
    if (!running) startGame();
    else showQuestion();
  });

  resetBtn.addEventListener('click', () => {
    location.reload();
  });

  shareBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(`Kelime Okyanusu Fen Bilimleri Quiz Skoru: ${score}/10`);
    showToast('Skor kopyalandı!');
  });

  let musicPlaying = false;
  musicBtn.addEventListener('click', () => {
    const audio = document.getElementById('bg-music');
    if (!musicPlaying) {
      audio.volume = 0.25;
      audio.play();
      musicBtn.textContent = '🔇 Sustur';
      musicPlaying = true;
    } else {
      audio.pause();
      musicBtn.textContent = '🎵 Müzik';
      musicPlaying = false;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (!running) return;
    const key = e.key;
    if (key >= '1' && key <= '4') {
      const index = parseInt(key) - 1;
      const buttons = answersWrap.querySelectorAll('.answer');
      if (buttons[index] && !buttons[index].classList.contains('dim')) {
        selectAnswer(index);
      }
    }
  });
</script>
</body>
</html>
